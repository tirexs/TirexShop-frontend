<table
    tuiTable
    class="table"
    [columns]="columns"
>
    <thead>
        <tr tuiThGroup>
          <th *tuiHead="'Id'" tuiTh>Id</th>
          <th *tuiHead="'Name'" tuiTh>Name</th>
          <th *tuiHead="'Description'" tuiTh>Description</th>
        </tr>
    </thead>
    <tbody
        tuiTbody
        [data]="getData"
    >
        <tr
            *ngFor="let item of getData"
            tuiTr
        >
        <td
            *tuiCell="'Id'"
            tuiTd
        >
            {{ item.id }}
        </td>
        <td
            *tuiCell="'Name'"
            tuiTd
        >
            {{ item.name }}
        </td>
            <td
                *tuiCell="'Description'"
                tuiTd
            >
                {{ item.description }}
            </td>
        </tr>
    </tbody>
</table>
